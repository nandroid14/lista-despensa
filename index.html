<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de despensa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1">
<meta name="theme-color" content="#0f172a">
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #offline {
    position: fixed; inset: 0; display: none; flex-direction: column; overflow-y: auto;
    padding: max(28px, env(safe-area-inset-top)) 22px 40px;
    background: linear-gradient(140deg, #0f172a, #1e293b); color: #ffffff;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  #offline.on { display: flex; }
  #offline .top { text-align: center; margin-bottom: 18px; }
  #offline .ico { font-size: 44px; }
  #offline h1 { font-size: 22px; font-weight: 800; margin: 6px 0 4px; letter-spacing: -0.02em; }
  #offline p { margin: 0; color: rgba(255,255,255,0.74); font-size: 14px; }
  #offline .ult { color: #fbbf24; font-size: 13px; font-weight: 700; margin-top: 8px; }
  #offline button { background: #fbbf24; color: #1a1208; border: 0; border-radius: 999px; padding: 13px 30px; font-size: 15px; font-weight: 800; font-family: inherit; margin: 10px auto 0; display: block; }
  #offline button:disabled { opacity: 0.6; }
  #offline h2 { font-size: 15px; margin: 22px 0 8px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  #offline h2 .dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .dot.heb { background: #b8503f; } .dot.costco { background: #2f5d8a; }
  #offline h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.12em; color: #9aa4b8; margin: 12px 0 6px; font-weight: 700; }
  .row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; }
  .row .cb { width: 22px; height: 22px; border-radius: 7px; border: 2px solid rgba(255,255,255,0.35); flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 900; }
  .row.on .cb { background: #3f9b6a; border-color: #3f9b6a; }
  .row.on .t { text-decoration: line-through; color: #9aa4b8; }
  .row .t { flex: 1; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .q { color: #fbbf24; font-weight: 800; font-size: 13px; }
  .vacio { color: #9aa4b8; font-size: 13.5px; }
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbynW1RlF5vIj5FtEKI46BZtiz2D0fYevk17cXdPQmqOrCxJ8BiuD-7d_qo-Ikj5cFyYgQ/exec" allow="clipboard-write"></iframe>

<div id="offline">
  <div class="top">
    <div class="ico">📡</div>
    <h1>Sin conexión</h1>
    <p>Para marcar o cambiar cosas hace falta internet. Mientras, aquí está la lista tal como quedó la última vez.</p>
    <div class="ult" id="ult"></div>
    <button type="button" id="retry">Reintentar</button>
  </div>
  <div id="listas"><div class="vacio">Sin listas guardadas todavía. Abre la app con internet una vez.</div></div>
</div>

<script>
(function () {
  var marco = document.getElementById('app');
  var EXEC = marco.src;
  var panel = document.getElementById('offline');
  var btn = document.getElementById('retry');
  var ult = document.getElementById('ult');
  var vivo = false;
  var appWin = null;

  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function leer(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }

  /* La app avisa quién es y manda un resumen de las listas para verlas sin red. */
  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (!m || m.app !== 'despensa') return;
    if (ev.source) appWin = ev.source;
    if (m.tipo === 'hola') { vivo = true; guardar('ld_ultimoAcceso', Date.now()); ocultar(); }
    else if (m.tipo === 'resumen') guardar('ld_resumen', m.data);
  });

  function textoUltimo() {
    var t = Number(leer('ld_ultimoAcceso')) || 0;
    if (!t) return 'Aún no has abierto la app en este dispositivo.';
    var min = Math.round((Date.now() - t) / 60000);
    if (min < 1) return 'Último acceso: hace un momento';
    if (min < 60) return 'Último acceso: hace ' + min + ' min';
    var hrs = Math.round(min / 60);
    if (hrs < 24) return 'Último acceso: hace ' + hrs + (hrs === 1 ? ' hora' : ' horas');
    var d = new Date(t);
    return 'Último acceso: ' + d.toLocaleDateString('es-MX') + ' a las ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pintarOffline() {
    ult.textContent = textoUltimo();
    var r = leer('ld_resumen'); var box = document.getElementById('listas');
    if (!r || !r.listas) return;
    box.innerHTML = r.listas.map(function (l) {
      var h = '<h2><span class="dot ' + (l.tienda === 'semanal' ? 'heb' : 'costco') + '"></span>' + esc(l.nombre) + '</h2>';
      if (!l.items.length) return h + '<div class="vacio">Lista vacía.</div>';
      var cat = '';
      l.items.sort(function (a, b) { return (a.listo ? 1 : 0) - (b.listo ? 1 : 0) || String(a.categoria).localeCompare(String(b.categoria)); });
      l.items.forEach(function (it) { if (!it.listo && it.categoria !== cat) { cat = it.categoria; h += '<h3>' + esc(cat) + '</h3>'; } h += '<div class="row' + (it.listo ? ' on' : '') + '"><span class="cb">' + (it.listo ? '✓' : '') + '</span><span class="t">' + esc(it.nombre) + '</span><span class="q">× ' + esc(it.cantidad || 1) + '</span></div>'; });
      return h;
    }).join('');
  }
  function mostrar() { pintarOffline(); panel.classList.add('on'); }
  function ocultar() { panel.classList.remove('on'); }

  function probar() {
    if (!navigator.onLine) { mostrar(); return; }
    fetch(EXEC, { mode: 'no-cors', cache: 'no-store' })
      .then(function () { if (!vivo) setTimeout(function () { if (!vivo) mostrar(); }, 25000); })
      .catch(function () { if (!vivo) mostrar(); });
  }
  window.addEventListener('offline', mostrar);
  window.addEventListener('online', function () { vivo = false; marco.src = EXEC + '?r=' + Date.now(); probar(); });
  btn.addEventListener('click', function () {
    btn.disabled = true; btn.textContent = 'Reintentando…'; vivo = false;
    marco.src = EXEC + '?r=' + Date.now();
    setTimeout(function () { probar(); btn.disabled = false; btn.textContent = 'Reintentar'; }, 2500);
  });
  probar();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
